[package]
name = "bcn-ffi"
description = "C ABI of the bayescompR native backends, linked into the R packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
cranelift = ["dep:bcn-cranelift"]
llvm = []

[dependencies]
bcn-core = { path = "../bcn-core" }
bcn-cranelift = { path = "../bcn-cranelift", optional = true }
serde_json.workspace = true

