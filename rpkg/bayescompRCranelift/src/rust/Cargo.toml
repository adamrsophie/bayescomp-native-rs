[workspace]
resolver = "2"
members = ["crates/bcn-core", "crates/bcn-cranelift", "crates/bcn-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
authors = ["Adam R Sophie <adamrsophie@gmail.com>"]
repository = "https://github.com/adamrsophie/bayescomp-native-rs"

[workspace.dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "unwind"
