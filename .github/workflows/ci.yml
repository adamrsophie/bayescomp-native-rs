name: native

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p bcn-core -p bcn-cranelift -p bcn-ffi --examples
      - run: cargo test --release --locked -p bcn-core -p bcn-cranelift -p bcn-ffi

  # the minimum supported Rust version
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - run: cargo test --release --locked -p bcn-core -p bcn-cranelift -p bcn-ffi

  # the shared library bayescompR downloads, loaded through its installer and
  # compared with the R backend
  shared-library:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p bcn-ffi --features cranelift
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install bayescompR
        run: |
          install.packages("remotes")
          remotes::install_github("adamrsophie/bayescompR", upgrade = "never", dependencies = TRUE)
        shell: Rscript {0}
      - name: Install the library with bayescompR and compare it with the R backend
        run: |
          library(bayescompR)
          Sys.setenv(R_USER_DATA_DIR = tempfile())
          lib <- Sys.glob(c("target/release/libbcn_ffi.so", "target/release/libbcn_ffi.dylib", "target/release/bcn_ffi.dll"))[1]
          bayescomp_install_backend("cranelift", path = lib)
          m <- bayescomp_model("data { int N; vector[N] y; } parameters { real mu; real<lower=0> s; }
                                model { mu ~ normal(0, 5); s ~ exponential(1); y ~ normal(mu, s); }",
                               data = list(N = 20, y = seq(-1, 2, length.out = 20)), backend = "cranelift", allow_fallback = TRUE)
          v <- bayescomp_validate_backend(m)
          stopifnot(max(v$lp_rel) < 1e-8, max(v$grad_rel) < 1e-8)
        shell: Rscript {0}
      - name: Edge cases against the R backend
        run: |
          lib=$(ls target/release/libbcn_ffi.so target/release/libbcn_ffi.dylib target/release/bcn_ffi.dll 2> /dev/null | head -1)
          Rscript tests/parity.R "$lib" cranelift
      - name: Cross check the interpreter and the JIT against the R backend
        if: runner.os != 'Windows'
        run: |
          cargo build --release --locked -p bcn-core -p bcn-cranelift --examples
          Rscript tests/crosscheck.R "$RUNNER_TEMP/x1" target/release/examples/eval
          Rscript tests/crosscheck.R "$RUNNER_TEMP/x2" target/release/examples/eval_jit

  llvm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # the distribution's LLVM (static libraries need the Polly and compression dev files)
            sudo apt-get update
            sudo apt-get install -y llvm-dev libzstd-dev zlib1g-dev libxml2-dev libffi-dev libedit-dev
            cfg=$(command -v llvm-config)
            v=$("$cfg" --version | cut -d. -f1)
            sudo apt-get install -y "libpolly-$v-dev" || true
          else
            brew install llvm@20
            cfg="$(brew --prefix llvm@20)/bin/llvm-config"
          fi
          v=$("$cfg" --version | cut -d. -f1)
          echo "LLVM_CONFIG=$cfg" >> "$GITHUB_ENV"
          echo "LLVM_MAJOR=$v" >> "$GITHUB_ENV"
          case "$v" in 18) s=181;; *) s=${v}1;; esac
          echo "LLVM_SYS_${s}_PREFIX=$("$cfg" --prefix)" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Build the LLVM shared library
        run: cargo build --release --locked -p bcn-ffi --features "llvm$LLVM_MAJOR"
      - name: Install bayescompR
        run: |
          install.packages("remotes")
          remotes::install_github("adamrsophie/bayescompR", upgrade = "never", dependencies = TRUE)
        shell: Rscript {0}
      - name: Edge cases against the R backend
        run: |
          lib=$(ls target/release/libbcn_ffi.so target/release/libbcn_ffi.dylib 2> /dev/null | head -1)
          Rscript tests/parity.R "$lib" llvm
      - name: Cross check the LLVM JIT against the R backend
        run: |
          cargo build --release --locked -p bcn-llvm --features "llvm$LLVM_MAJOR" --examples
          Rscript tests/crosscheck.R "$RUNNER_TEMP/x3" target/release/examples/eval_llvm
