name: native

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p bcn-core -p bcn-cranelift -p bcn-ffi --examples
      - run: cargo test --release --locked -p bcn-core -p bcn-cranelift -p bcn-ffi
      - name: Vendored crates match the workspace
        if: runner.os != 'Windows'
        run: |
          sh tools/sync-rust.sh
          # the vendored archive's bytes depend on the xz library; inst/AUTHORS tracks its crates
          git diff --exit-code -- rpkg ':(exclude)*vendor.tar.xz'

  # the oldest rustc on the CRAN build machines
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - run: cargo test --release --locked -p bcn-core -p bcn-cranelift -p bcn-ffi

  rpkg:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # on Windows the GNU host toolchain, as in Rtools on CRAN: build scripts
      # linked by MSVC link.exe fail on the long paths of an R CMD check
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ runner.os == 'Windows' && 'stable-x86_64-pc-windows-gnu' || 'stable' }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: rpkg/bayescompRCranelift
          extra-packages: any::rcmdcheck, github::adamrsophie/bayescompR
          needs: check
      # as CRAN checks it: offline build from the vendored crates, NOT_CRAN unset
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: rpkg/bayescompRCranelift
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      - name: Cross check the interpreter and the JIT against the R backend
        if: runner.os != 'Windows'
        run: |
          cargo build --release --locked -p bcn-core -p bcn-cranelift --examples
          Rscript tests/crosscheck.R "$RUNNER_TEMP/x1" target/release/examples/eval
          Rscript tests/crosscheck.R "$RUNNER_TEMP/x2" target/release/examples/eval_jit

  llvm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # the distribution's LLVM (static libraries need the Polly and compression dev files)
            sudo apt-get update
            sudo apt-get install -y llvm-dev libzstd-dev zlib1g-dev libxml2-dev libffi-dev libedit-dev
            cfg=$(command -v llvm-config)
            v=$("$cfg" --version | cut -d. -f1)
            sudo apt-get install -y "libpolly-$v-dev" || true
          else
            brew install llvm@20
            cfg="$(brew --prefix llvm@20)/bin/llvm-config"
          fi
          v=$("$cfg" --version | cut -d. -f1)
          echo "LLVM_CONFIG=$cfg" >> "$GITHUB_ENV"
          echo "LLVM_MAJOR=$v" >> "$GITHUB_ENV"
          case "$v" in 18) s=181;; *) s=${v}1;; esac
          echo "LLVM_SYS_${s}_PREFIX=$("$cfg" --prefix)" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install bayescompR
        run: |
          install.packages(c("remotes", "testthat"))
          remotes::install_github("adamrsophie/bayescompR", upgrade = "never", dependencies = TRUE)
        shell: Rscript {0}
      - name: Install bayescompRLLVM
        run: R CMD INSTALL rpkg/bayescompRLLVM
      - name: Package tests
        working-directory: rpkg/bayescompRLLVM/tests
        run: Rscript -e 'library(testthat); library(bayescompRLLVM); res <- test_dir("testthat", reporter = "summary", stop_on_failure = TRUE)'
      - name: Cross check the LLVM JIT against the R backend
        run: |
          cargo build --release --locked -p bcn-llvm --features "llvm$LLVM_MAJOR" --examples
          Rscript tests/crosscheck.R "$RUNNER_TEMP/x3" target/release/examples/eval_llvm
